<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data-Types</title>
</head>
<body>
    <h3>Data-types in JS:</h3>
    <ol>
        <li>Number</li>
        <li>String</li>
        <li>NULL</li>
        <li>Undefined</li>
        <li>Boolean</li>
        <li>Object</li>
    </ol>
    <pre>
        <script>
            console.log("Hi I am Beginer in JavaScript");
            let marks = 76234;
            console.log("Marks :",marks);
            console.log('type of marks is',typeof marks);
            let studentName = "Raghu.j";
            console.log("Student Name :",studentName);
            console.log('type of studentName is',typeof studentName);
            let b = null;
            console.log('type of a is',typeof b);
            let isvalid = true;
            console.log("isvalid :",isvalid);
            console.log('type of isvalid is',typeof isvalid);
            let Age ;
            console.log("Age :",Age);
            console.log('type of Age is',typeof Age);
            let Sems =[1,2,3,4,5,6];
            console.log("Sems :",Sems);
            console.log('type of Sems is',typeof Sems);

            let NoOfstudents={
                "A":21,
                "B":22,
                "C":23
            }
            console.log("NoOfstudents :",NoOfstudents);
            console.log('type of NoOfstudents is',typeof NoOfstudents);
            

        </script>
    </pre>
</body>
</html>
