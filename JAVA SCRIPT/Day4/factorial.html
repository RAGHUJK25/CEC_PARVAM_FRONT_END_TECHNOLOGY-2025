<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <h1>Factorial of number:</h1>
    <p>n*(n-1)</p>
    <p>3! =5*4*3*2*1</p>
    <script>
        const fact = (num) =>{
            let res = 1;
            for(let i=1;i<=num;i++){
                res = res * i;
            }
            console.log("Factorial of",num,"is :",res);
        }
        let num =5;
        fact(num);
    </script>
</body>
</html>
