<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Format</title>
</head>
<body>
    <h1>Tags list</h1>
    <pre>
        1. b : bold tag
        2. i : Italic tag
        3. u : underline tag
        4.sub : subscript tag
        5.sup : superscript tag
        6.del/s : delete tag
    </pre>
    <hr>
    <p><b>Lorem</b>, <div>ipsum <i>dolor</i></div> sit amet <div><u>consectetur</u></div> <s>adipisicingdiv</s>
         <del>elit</del>. <div>Accu<sub>4</sub>samus</div> <div>am<sup>6</sup>et.</p></div>
</body>
</html>
