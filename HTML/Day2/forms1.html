<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <center>
        <h1>Forms in html</h1>
    </center>
    <p><b>Registration Forms</b></p>
    <form>
        <ol>
            <fieldset>
                <legend>Personal Details</legend>
            <label for="f_name">First Name:</label>
            <input type="text" name="f_name" class="f_name " id="f_name" placeholder="Enter your first name"><br>
            <label for="l_name">Last Name:</label>
            <input type="text" name="l_name" class="l_name " id="l_name" placeholder="Enter your last name"><br>
            <label for="email">Email:</label>
            <input type="text" name="email" class="email" id="email" placeholder="Enter your Email"><br>
            <label for="password">Password</label>
            <input type="text" name="password" class="password " id="password" placeholder="Enter your Password"><br>
            <label for="">Gender:</label><br>
            <label for="male">Male</label>
            <input type="radio" name="gender" class="male" id="male">
            <label for="female">Female</label>
            <input type="radio" name="gender" class="female" id="female">
            <label for="other">Other</label>
            <input type="radio" name="gender" class="other" id="other"><br>
            <label for="age">Age:</label>
            <input type="number" name="age" class="age" id="age" placeholder="Enter your Age"><br>
            </fieldset>
            <label>Skills:</label><br>
            <label for="html">HTML:</label>
            <input type="checkbox" name="skills" class="html" id="html">
            <label for="css">CSS:</label>
            <input type="checkbox" name="skills" class="css" id="css">
            <label for="js">JS:</label>
            <input type="checkbox" name="skills" class="js" id="js">
            <label for="react">REACT.JS:</label>
            <input type="checkbox" name="skills" class="react" id="react"><br>

            <label for="dob">Date Of Birth:</label>
            <input type="date" name="dob" class="dob" id="dob"><br>
            <label for="address">Address:</label><br>
            <textarea name="address" id="address" class="address" cols="50" rows="5"
                placeholder="Enter your address"></textarea><br>
            <input type="submit" name="submit" class="submit" id="submit">
            <input type="reset" name="reset" class="reset" id="reset">
        </ol>
    </form>
</body>

</html>
